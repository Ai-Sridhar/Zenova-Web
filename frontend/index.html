<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zenova AI</title>
    <link rel="icon" type="image/x-icon" href="./logo.jpeg">

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="particles"></div>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo-section">

            <img src="./logo.jpeg">

            <h1>ZENOVA</h1>

        </div>

        <ul class="nav-links">

            <li><a href="#">Home</a></li>

            <li><a href="#">Features</a></li>

            <li><a href="#">About</a></li>

            <li><a href="#">Contact</a></li>

        </ul>

    </nav>

    <!-- HERO -->

    <section class="hero">

        <div class="background-glow"></div>

        <!-- LOGO -->

        <div class="logo-container">

            <div class="rotating-ring"></div>

            <div class="rotating-ring ring2"></div>

            <img src="./logo.jpeg" class="hero-logo">

        </div>

        <!-- TITLE -->

        <h1 class="animated-title">

            <span class="text-gradient">
                Welcome to Zenova AI
            </span>

            <div class="spark spark1"></div>
            <div class="spark spark2"></div>
            <div class="spark spark3"></div>

        </h1>

        <!-- DESCRIPTION -->

        <p>
            Experience the future of intelligent conversations with Zenova AI.
            A futuristic AI chatbot designed to assist, inspire and innovate.
        </p>

        <!-- BUTTON -->

        <button class="start-btn" onclick="openChat()">

            Start Chatting →

        </button>

    </section>

    <script src="script.js"></script>
